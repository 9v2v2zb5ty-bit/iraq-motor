name: Update cars snapshot
on:
  schedule:
    - cron: '0 * * * *'   # كل ساعة
  workflow_dispatch:       # تشغيل يدوي من تبويب Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html 404.html
          git diff --cached --quiet || (git commit -m "Update cars snapshot" && git push)
