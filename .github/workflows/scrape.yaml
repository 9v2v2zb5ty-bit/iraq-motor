name: OpenSooq Scraper

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours, UTC time (Iraq = UTC+3)
  workflow_dispatch:
    inputs:
      mode:
        description: 'وضع التشغيل'
        required: true
        default: 'once'
        type: choice
        options:
          - once
          - debug

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install playwright

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Write Firebase service account file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Run scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node index.js ${{ github.event.inputs.mode || 'once' }}
